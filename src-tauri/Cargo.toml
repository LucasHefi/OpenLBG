[package]
name = "openlbg"
version = "0.3.3"
description = "A wallpaper marketplace for Linux"
authors = ["OpenLBG"]
edition = "2021"

[lib]
name = "openlbg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
